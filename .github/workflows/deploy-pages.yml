name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Web Artifacts
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: Deploy to GitHub Pages
        if: steps.setup_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: GitHub Pages Status Notice
        if: steps.setup_pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages Deployment Skipped::GitHub Pages is not enabled in repository settings. To enable: Go to Settings -> Pages -> Source: 'GitHub Actions'. (If you are deploying via Cloudflare Pages, this workflow gracefully skips without failing)."
