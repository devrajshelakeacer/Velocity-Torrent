name: "🐛 Bug Report"
description: "File an issue to help improve VELOCITY"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report an issue with VELOCITY! Please describe the bug clearly."
  - type: input
    id: version
    attributes:
      label: "VELOCITY Version"
      placeholder: "e.g. v1.0.0-rc1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - "Windows 11 (64-bit)"
        - "Windows 10 (64-bit)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description & Steps to Reproduce"
      description: "Explain what happened and how to reproduce it."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
