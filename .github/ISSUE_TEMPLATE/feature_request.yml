name: "💡 Feature Request"
description: "Suggest an idea or enhancement for VELOCITY"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Have an idea for a new feature in VELOCITY? Let us know!"
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Opportunity"
      description: "Is your feature request related to a specific limitation?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe how you envision this feature working in VELOCITY."
    validations:
      required: true
